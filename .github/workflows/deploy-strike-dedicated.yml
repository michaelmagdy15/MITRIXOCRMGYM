name: Deploy Strike Gym Dedicated Updates

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-strike-dedicated
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_STRIKE_SECRET: ${{ secrets.STRIKE_GCP_SA_KEY != '' }}
      PROJECT_ID: ${{ secrets.STRIKE_GCP_PROJECT_ID || 'strike-production-f5242' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build & Lint Verification Gate
        run: |
          npm run build
          npm run lint

      # Authenticate to Strike's Google Cloud Project
      - name: Authenticate to Strike Google Cloud
        if: env.HAS_STRIKE_SECRET == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STRIKE_GCP_SA_KEY }}

      # Deploy updated firestore-tenant.rules, indexes, storage rules, and hosting web app to Strike Firebase
      - name: Deploy Rules, Indexes, Storage & Hosting to Strike Firebase
        if: env.HAS_STRIKE_SECRET == 'true'
        run: |
          npx --yes firebase-tools deploy --config firebase.standalone.json --only firestore:rules,firestore:indexes,storage,hosting --project $PROJECT_ID --non-interactive

      # Set up Google Cloud SDK
      - name: Set up Cloud SDK
        if: env.HAS_STRIKE_SECRET == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # Deploy Cloud Run API backend service
      - name: Deploy Cloud Run API Service
        if: env.HAS_STRIKE_SECRET == 'true'
        run: |
          gcloud run deploy strike-crm-platform \
            --source . \
            --region europe-west1 \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,STANDALONE_MODE=true,STANDALONE_TENANT_ID=strike,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCLOUD_PROJECT=$PROJECT_ID \
            --service-account=firebase-adminsdk-fbsvc@$PROJECT_ID.iam.gserviceaccount.com



