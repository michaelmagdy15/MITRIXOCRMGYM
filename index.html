<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / home-screen install -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mitrixogymcrm" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="mitrixogymcrm" />

    <!-- iOS home-screen icon (proper square with padding) -->
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icon.png" />

    <!-- Browser tab favicon -->
    <link id="favicon-32" rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link id="favicon-16" rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link id="favicon-shortcut" rel="shortcut icon" href="/favicon.png" />

    <title>CRM</title>
    <!-- FIREBASE_CONFIG_PLACEHOLDER -->
    <script type="text/javascript">
      // Immediately resolve tenant title and favicon before React mounts
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var t = (params.get('tenant') || '').toLowerCase();
          var host = window.location.hostname.toLowerCase();
          var cfgTenant = (window.__FIREBASE_CONFIG__ && window.__FIREBASE_CONFIG__.tenantId) ? window.__FIREBASE_CONFIG__.tenantId.toLowerCase() : '';
          var isInzan = t === 'inzan' || t === 'inzanathletics' || host.indexOf('inzan') !== -1 || cfgTenant.indexOf('inzan') !== -1;
          
          var companyName = isInzan ? 'INZAN ATHLETICS' : 'STRIKE';
          var faviconPath = isInzan ? '/inzan-favicon.png' : '/favicon.png';
          
          document.title = companyName;
          
          var f32 = document.getElementById('favicon-32');
          if (f32) f32.href = faviconPath;
          var f16 = document.getElementById('favicon-16');
          if (f16) f16.href = faviconPath;
          var fsc = document.getElementById('favicon-shortcut');
          if (fsc) fsc.href = faviconPath;
        } catch(e) {}
      })();

      // Force cache-busting on mobile WebViews to bypass stale cache
      (function() {
        var isWebView = /mitrixogymcrmCRM-Mobile|Strike.*Mobile|STRIKE/i.test(navigator.userAgent) || window.ReactNativeWebView;
        if (isWebView && window.location.search.indexOf('cb=') === -1) {
          var separator = window.location.search ? '&' : '?';
          window.location.replace(
            window.location.origin + 
            window.location.pathname + 
            window.location.search + 
            separator + 
            'cb=' + Date.now()
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
